name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  check-title:
    name: Check PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate KLADOS-<issue> prefix
        id: validate
        env:
          TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ ! "$TITLE" =~ ^KLADOS-([0-9]+):\ .+ ]]; then
            echo "::error::PR title must start with 'KLADOS-<issue number>: '. Got: $TITLE"
            echo "Example: KLADOS-100: add species description section"
            exit 1
          fi

          ISSUE="${BASH_REMATCH[1]}"

          # Confirm the referenced issue actually exists (and isn't a PR).
          if ! gh api "repos/$REPO/issues/$ISSUE" --jq '.number' >/dev/null 2>&1; then
            echo "::error::Issue #$ISSUE does not exist in $REPO"
            exit 1
          fi
          if [[ "$(gh api "repos/$REPO/issues/$ISSUE" --jq '.pull_request != null')" == "true" ]]; then
            echo "::error::#$ISSUE is a pull request, not an issue"
            exit 1
          fi

          echo "OK: title references issue #$ISSUE"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Link PR to issue
        env:
          BODY: ${{ github.event.pull_request.body }}
          ISSUE: ${{ steps.validate.outputs.issue }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Fork PRs hand this workflow a read-only token, so the edit would fail.
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::warning::PR is from a fork ($HEAD_REPO); cannot edit its body. Add 'Closes #$ISSUE' manually."
            exit 0
          fi

          # Idempotent: the edit below re-triggers this workflow, and the second
          # run must be a no-op.
          if grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#${ISSUE}([^0-9]|$)" <<<"$BODY"; then
            echo "Body already closes #$ISSUE; nothing to do."
            exit 0
          fi

          if [[ -n "${BODY//[[:space:]]/}" ]]; then
            NEW_BODY="$BODY"$'\n\n'"Closes #$ISSUE"
          else
            NEW_BODY="Closes #$ISSUE"
          fi

          gh api "repos/$REPO/pulls/$NUMBER" -X PATCH -f body="$NEW_BODY"
          echo "Added 'Closes #$ISSUE' to the PR body."
